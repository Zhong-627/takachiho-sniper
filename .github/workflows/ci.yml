name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/takachiho-playwright
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install browser for local fixtures
        run: npx playwright install --with-deps chromium
      - name: Typecheck, lint and offline fixture tests
        # Network isolation applies only to this child process, not the runner.
        # Loopback allows local HTTP fixtures; no external interface exists.
        # Use the fixed browser path because this namespace command runs as root.
        run: |
          sudo --preserve-env=PATH,PLAYWRIGHT_BROWSERS_PATH,CI unshare --net -- bash -c '
            ip link set lo up
            npm run check
          '
